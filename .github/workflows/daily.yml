name: Daily Career Scout

# Triggers
on:
  schedule:
    # 07:00 UTC = 08:00 Madrid (invierno) / 09:00 Madrid (verano)
    - cron: '0 7 * * *'
  # Allows manual triggering via the 'Run workflow' button (for testing)
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code from repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Python environment
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # 3. Install dependencies from requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run the main script
      - name: Run Job Agent
        # Groq (free): API_KEY=gsk_xxx, API_BASE=https://api.groq.com/openai/v1, LLM_MODEL=llama-3.3-70b-versatile
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_BASE: ${{ secrets.API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          CRITERIA: ${{ secrets.CRITERIA }}
          SCORE_THRESHOLD: ${{ secrets.SCORE_THRESHOLD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          RESUME_FILE_ID: ${{ secrets.RESUME_FILE_ID }}
        run: python main.py
name: Daily Career Scout (LinkedIn Job Sniper)

# El agente vive en la raíz de este repositorio.

on:
  schedule:
    # 10:00 UTC = 11:00 Madrid (invierno) / 12:00 (verano). Queda fuera del
    # peak de DeepSeek (01-04 y 06-10 UTC, L-V), así el fallback paga la mitad.
    # El dedupe evita repetidos aunque GitHub retrase el cron.
    - cron: '0 10 * * *'
  # Manual: por defecto solo el informe (sin PDFs, que gastan más cuota).
  workflow_dispatch:
    inputs:
      pdfs:
        description: "Generar PDFs adaptados (gasta más cuota Groq)"
        type: boolean
        default: false

concurrency:
  group: linkedin-job-sniper
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          # Sin trazas: los tests no deben depender de LangSmith/red.
          LANGSMITH_TRACING: 'false'
          LANGCHAIN_TRACING_V2: 'false'
        run: |
          pip install pytest
          python -m pytest

      - name: Restore sent-jobs history
        # El runner es efímero: sin esto el historial local se pierde y el
        # deduplicado depende solo de Google Sheets. La caché lo conserva.
        uses: actions/cache@v4
        with:
          path: ~/.linkedin_job_sniper/logs
          key: linkedin-job-sniper-history-${{ github.run_id }}
          restore-keys: |
            linkedin-job-sniper-history-

      - name: Run Job Agent
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_BASE: ${{ secrets.API_BASE }}
          # Modelo validado en el repo (no hardcodear: los IDs cambian).
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          # Menos ofertas por término y ventana más corta para no reventar la
          # cuota. Si sobra margen, subir RESULT_LIMIT.
          RESULT_LIMIT: '2'
          HOURS_OLD: '24'
          # Fallback de pago cuando Groq agota su cuota. Off-peak = mitad de
          # precio (peak: 01-04 y 06-10 UTC, L-V; el informe cae en off-peak).
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_BASE: https://api.deepseek.com
          DEEPSEEK_MODEL: deepseek-flash
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          CRITERIA: ${{ secrets.CRITERIA }}
          SCORE_THRESHOLD: ${{ secrets.SCORE_THRESHOLD }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          RESUME_FILE_ID: ${{ secrets.RESUME_FILE_ID }}
          # InfoJobs (API oficial). Opcional: si falta, la fuente se omite.
          INFOJOBS_CLIENT_ID: ${{ secrets.INFOJOBS_CLIENT_ID }}
          INFOJOBS_CLIENT_SECRET: ${{ secrets.INFOJOBS_CLIENT_SECRET }}
        run: python main.py

      - name: Prepare base CV
        # El generador de PDFs necesita un CV base en CV_BASE_DIR. Se baja el
        # PDF real de Drive si hay credenciales; si no, se reconstruye desde
        # RESUME_TEXT. Así el CV personalizado conserva el formato original.
        # El PDF re-scrapea y re-evalúa LinkedIn; solo cuando se pide a mano.
        if: inputs.pdfs
        env:
          CV_BASE_DIR: ${{ github.workspace }}/resumes
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          RESUME_FILE_ID: ${{ secrets.RESUME_FILE_ID }}
        run: |
          python - <<'PY'
          import io
          import json
          import os
          from pathlib import Path

          import fitz

          destino = Path(os.environ["CV_BASE_DIR"])
          destino.mkdir(parents=True, exist_ok=True)
          pdf = destino / "cv_base.pdf"

          credenciales = os.environ.get("GCP_CREDENTIALS_JSON", "")
          file_id = os.environ.get("RESUME_FILE_ID", "")
          if credenciales and file_id:
              from google.oauth2 import service_account
              from googleapiclient.discovery import build
              from googleapiclient.http import MediaIoBaseDownload

              creds = service_account.Credentials.from_service_account_info(
                  json.loads(credenciales),
                  scopes=["https://www.googleapis.com/auth/drive.readonly"],
              )
              servicio = build("drive", "v3", credentials=creds)
              buffer = io.BytesIO()
              descarga = MediaIoBaseDownload(buffer, servicio.files().get_media(fileId=file_id))
              terminado = False
              while not terminado:
                  _, terminado = descarga.next_chunk()
              pdf.write_bytes(buffer.getvalue())
          else:
              texto = os.environ.get("RESUME_TEXT", "")
              if not texto.strip():
                  raise SystemExit("Falta RESUME_TEXT o RESUME_FILE_ID para el CV base")
              lineas = texto.splitlines()
              documento = fitz.open()
              for i in range(0, len(lineas), 55):
                  pagina = documento.new_page()
                  pagina.insert_textbox(
                      fitz.Rect(40, 40, 555, 800), "\n".join(lineas[i:i + 55]), fontsize=10
                  )
              documento.save(pdf)
              documento.close()
          print(f"CV base listo: {pdf}")
          PY

      - name: Run autonomous agent (tailored CVs)
        # Genera los PDFs adaptados con el nuevo diseño y los registra en
        # applications.log (que se conserva en la caché de historial).
        # El PDF re-scrapea y re-evalúa LinkedIn; solo cuando se pide a mano.
        if: inputs.pdfs
        env:
          CV_BASE_DIR: ${{ github.workspace }}/resumes
          API_KEY: ${{ secrets.API_KEY }}
          API_BASE: ${{ secrets.API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_API_BASE: https://api.deepseek.com
          DEEPSEEK_MODEL: deepseek-flash
          PROXY_URL: ${{ secrets.PROXY_URL }}
          RESUME_TEXT: ${{ secrets.RESUME_TEXT }}
          CRITERIA: ${{ secrets.CRITERIA }}
          SCORE_THRESHOLD: ${{ secrets.SCORE_THRESHOLD }}
          INFOJOBS_CLIENT_ID: ${{ secrets.INFOJOBS_CLIENT_ID }}
          INFOJOBS_CLIENT_SECRET: ${{ secrets.INFOJOBS_CLIENT_SECRET }}
        run: python autonomous_agent.py --once --max-tailored 5

      - name: Upload tailored CVs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tailored-cvs
          path: resumes/tailored/
          if-no-files-found: ignore

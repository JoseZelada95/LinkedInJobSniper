# ── Configuración del proyecto para herramientas de desarrollo ──────────────
# Las dependencias se declaran en requirements.txt / requirements-dev.txt
# (es lo que usa el GitHub Action), por eso aquí solo van ajustes de tooling.

[tool.pytest.ini_options]
# Añade la raíz del proyecto al sys.path para poder hacer `import job_sniper`.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

# ── Linter / formateador (ruff) ──────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # la longitud de línea la gestiona el formateador

# ── Comprobación de tipos (mypy) ─────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
